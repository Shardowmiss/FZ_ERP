name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # postinstall 会执行 fullstack-cli（依赖飞书 aPaaS 平台运行时），
      # 在通用 CI 环境无法运行，故使用 --ignore-scripts 跳过，仅安装依赖。
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type check (server)
        run: npm run type:check:server

      - name: Type check (client)
        run: npm run type:check:client

      - name: Unit tests
        run: npm run test
