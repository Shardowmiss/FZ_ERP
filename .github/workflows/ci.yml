name: CI

on:
  push:
    branches: [erp, main, master, dev]
  pull_request:
    branches: [erp, main, master, dev]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # postinstall 会执行 fullstack-cli（依赖飞书 aPaaS 平台运行时），
      # 在通用 CI 环境无法运行，故使用 --ignore-scripts 跳过，仅安装依赖。
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type check (server)
        run: npm run type:check:server

      - name: Type check (client)
        run: npm run type:check:client

      - name: Unit tests
        run: npm run test

  # ---- P0-4 安全门禁①：依赖漏洞扫描 ----
  # 生产运行时依赖：硬性门禁（当前 0 high+，必须保持绿色）。
  # 全部依赖（含 dev 工具链）：仅告警不阻断，当前 1 critical + 20 high 均为 dev 依赖，
  #   已登记技术债并制定修复计划（见评估报告 P0-4），生产运行时已通过上方硬性门禁。
  # 注意：仓库 .npmrc 指向 npmmirror，其审计端点未实现（NOT_IMPLEMENTED），
  #   故审计必须显式指向官方 registry，否则 CI 会误报失败。
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit production dependencies (blocking)
        run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org/

      - name: Audit all dependencies (warning only)
        continue-on-error: true
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org/

  # ---- P0-4 安全门禁②：密钥泄露扫描（全量历史 + 工作区）----
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
        with:
          args: detect --source . --redact --no-banner
